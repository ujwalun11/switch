# ---- Email (use an app password, not your normal password) ----
# Set credentials as environment variables:
#   export SMTP_USER="you@gmail.com"
#   export SMTP_PASS="your-16-char-app-password"
email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  username_env: SMTP_USER
  password_env: SMTP_PASS
  enabled: false
  # On GitHub the repo is public, so leave this blank and set the EMAIL_TO secret instead.
  to: ""
  max_jobs_per_email: 50

database: jobs.db

# ---- Filters (a job must pass all of them) ----
filters:
  # at least one must appear in title or description (leave empty to allow all)
  # Note: sites that show only a title (SAP) are matched on the title alone, so include title words too.
  include_keywords: [python, backend, data engineer, machine learning, software engineer, developer, intern]
  # skip jobs whose TITLE contains any of these
  exclude_title_keywords: [director, principal, staff, manager]
  # location must contain one of these (jobs with no listed location are kept)
  locations: [chennai, bangalore, bengaluru, hyderabad, remote, india]
  # full-time | internship | part-time | contract  (jobs of unknown type are kept)
  job_types: [full-time, internship]
  # ignore postings older than this, when the site gives a date
  max_age_days: 14

# ---- Sources ----
# greenhouse: board = the slug in boards.greenhouse.io/<slug>
# lever:      company = the slug in jobs.lever.co/<slug>
# ashby:      board = the slug in jobs.ashbyhq.com/<slug>
# rss:        any job feed URL
# html:       any careers page, using CSS selectors
sources:
  # KLA uses Workday: https://kla.wd1.myworkdayjobs.com/Search
  # `searches` runs these keywords on KLA's own search, so descriptions are matched too.
  - name: KLA (Workday)
    type: workday
    host: kla.wd1.myworkdayjobs.com
    tenant: kla
    site: Search
    company: KLA
    searches: [software, python, intern, "data engineer"]

  # SAP uses SuccessFactors; this scrapes its India search results, 25 jobs per page.
  - name: SAP India
    type: html
    company: SAP
    url: "https://jobs.sap.com/search/?q=&locationsearch=India"
    page_param: startrow
    page_size: 25
    max_pages: 4
    item: "tr.data-row"
    title: "a.jobTitle-link"
    link: "a.jobTitle-link"
    location: "span.jobLocation"

  - name: Stripe (Greenhouse)
    type: greenhouse
    board: stripe

  - name: Palantir (Lever)
    type: lever
    company: palantir

  - name: Ramp (Ashby)
    type: ashby
    board: ramp

  - name: We Work Remotely - Programming
    type: rss
    url: https://weworkremotely.com/categories/remote-programming-jobs.rss

